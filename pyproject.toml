[project]
name = "alpha-evolve"
version = "0.1.0"
description = "Production-grade, end-to-end AlphaEvolve code samples powered by Gemini Enterprise"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jordan Totten", email = "jordantotten@google.com" }
]
dependencies = [
    "google-auth>=2.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
    "pip-audit>=2.7.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "examples", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
]
ignore = [
    "E501",     # line length handled by formatter
    "COM812",   # trailing comma (formatter conflict)
    "ISC001",   # implicit string concat (formatter conflict)
]

[tool.ruff.lint.per-file-ignores]
"examples/**/run_evolution.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
